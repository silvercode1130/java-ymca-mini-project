spring.application.name=miniproject_pet_260124

#View Resolver
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

#Oracle DataSource
spring.datasource.driver-class-name=oracle.jdbc.driver.OracleDriver
spring.datasource.url=jdbc:oracle:thin:@localhost:1521/xe
spring.datasource.username=mini
spring.datasource.password=mini

#파일 용량 제한
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

#한 번의 요청(request)에서 업로드할 수 있는 파일 개수 제한
#이미 올라간 사진과 무관
#spring.servlet.multipart.max-file-count=2

#mem_img가 임시로 머무는 공간 - 에러 방지용ㅠㅠ
spring.servlet.multipart.location=C:/temp